version: '3.9'
services:
    keycloak:
        container_name: keycloak_dev
        image: quay.io/keycloak/keycloak:latest
        ports:
            - 9090:8080
        environment:
            KEYCLOAK_ADMIN: admin
            KEYCLOAK_ADMIN_PASSWORD: admin
        volumes:
            - keycloak_data:/opt/keycloak/data
        command:
            - 'start-dev'
        restart: unless-stopped

volumes:
    keycloak_data: